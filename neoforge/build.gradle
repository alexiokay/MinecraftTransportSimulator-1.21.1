plugins {
    id "java"
    id "eclipse"
    id "idea"
    id "net.neoforged.moddev" version "1.0.21"
}

//Set file name.
version = "${project.mc_version}-${project.mod_version}"
group = project.mod_group
archivesBaseName = project.archive_name

//Options for Java version to compile to.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
compileJava {
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

repositories {
    mavenCentral()
    // JEI maven
    maven { url = "https://maven.blamejared.com/" }
    // PlayerAnimator maven (KosmX's official repository)
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    // Configured maven
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com/"
    }
}

//Configuration that holds jars to include in the jar
configurations {
    jarJar
    fmodOnly
}

//NeoForge configuration
neoForge {
    version = project.neoforge_version

    // Access Transformers configuration
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }

    runs {
        client {
            client()

            jvmArguments.add("-Dmixin.debug.export=true")
        }

        server {
            server()

            jvmArguments.add("-Dmixin.debug.export=true")
        }
    }

    mods {
        register(project.mod_id) {
            sourceSet(sourceSets.main)
        }
    }
}

//Automatically copy mccore assets during build
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(":mccore").sourceSets.main.resources.srcDirs) {
        include "assets/mts/textures/**"
        include "assets/mts/lang/**"
        // Explicitly exclude FMOD sound banks from being copied
  
    }
}

//Specify dependencies.
dependencies {
    //Core dependency for compile-time
    implementation project(":mccore")

    //Use jarJar to embed the core at runtime
    jarJar(project(":mccore"))

    //Also add to additional runtime classpath for class loading
    additionalRuntimeClasspath project(":mccore")

    //Sound libraries - temporarily disabled to test basic mod loading
    //implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
    //implementation "org.jcraft:jorbis:0.0.17"
    //jarJar("com.googlecode.soundlibs:jlayer:1.0.1.4")
    //jarJar("org.jcraft:jorbis:0.0.17")

    //JEI API
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.22.1.316"

    //PlayerAnimator API for player model animations - DISABLED due to conflicts
    //implementation "dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.22.1.316"

    // Removed Configured dependency - using native NeoForge config GUI instead

    // FMOD bindings - back to 3.3.3, focus on working in dev mode first
    compileOnly("org.lwjgl:lwjgl-fmod:3.3.3")
    // For development environment
    additionalRuntimeClasspath("org.lwjgl:lwjgl-fmod:3.3.3")
    // Add to fmodOnly configuration for extraction
    fmodOnly("org.lwjgl:lwjgl-fmod:3.3.3")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

// Include FMOD classes directly in the JAR (without LWJGL system classes)
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Add FMOD classes directly to the JAR
    from(configurations.fmodOnly.collect { zipTree(it) }) {
        // Only include FMOD classes, not LWJGL system classes
        include 'org/lwjgl/fmod/**'
        // Exclude all module-info files to prevent conflicts
        exclude '**/module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
    }

    // Global exclusions
    exclude '**/module-info.class'
    exclude 'META-INF/versions/*/module-info.class'

    // Exclude FMOD sound files from the JAR
}